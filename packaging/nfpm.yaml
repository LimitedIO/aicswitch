name: aicswitch
arch: ${PKG_ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: LimitedIO <160145221+LimitedIO@users.noreply.github.com>
description: |
  Switch AIC8800 WiFi 6 / Bluetooth USB dongles (1111:1111 "88M80")
  out of their fake driver-CD mode so Linux can use them.
vendor: LimitedIO
homepage: https://limitedio.github.io/aicswitch/
license: MIT
contents:
  - src: ./build/aicswitch
    dst: /usr/sbin/aicswitch
    file_info: { mode: 0755 }
  - src: ./build/99-aicswitch.rules
    dst: /usr/lib/udev/rules.d/99-aicswitch.rules
    file_info: { mode: 0644 }
  - src: ./packaging/aicswitch-modules.conf
    dst: /usr/lib/modules-load.d/aicswitch.conf
    file_info: { mode: 0644 }
  - src: ./LICENSE
    dst: /usr/share/licenses/aicswitch/LICENSE
    file_info: { mode: 0644 }
scripts:
  postinstall: ./packaging/postinst.sh
  postremove: ./packaging/postinst.sh
